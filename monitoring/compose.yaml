# Local observability stack for Switchyard (Prometheus + Grafana).
# Scrapes BOTH routers: main (:4001) and v0.2.0-cachefix (:4000) on the host.
#
#   cd ~/switchyard-main/monitoring
#   podman compose up -d      (or: docker compose up -d)
#   Grafana:    http://127.0.0.1:3000   (admin / admin)
#   Prometheus: http://127.0.0.1:9090
#
# Both routers publish /metrics on host loopback; containers reach them via the
# podman host gateway (host.containers.internal, mapped below for portability).

services:
  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: switchyard-prometheus
    restart: unless-stopped
    network_mode: host
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--web.enable-lifecycle"
      - "--web.listen-address=0.0.0.0:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - prom-data:/prometheus

  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: switchyard-grafana
    restart: unless-stopped
    network_mode: host
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Required. Set in monitoring/.env (gitignored); compose refuses an empty value.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in monitoring/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # 0.0.0.0 = reachable from the LAN (needs firewall ports 3000/9090 open).
      # Use 127.0.0.1 for local-only.
      GF_SERVER_HTTP_ADDR: ${GRAFANA_BIND_ADDR:-0.0.0.0}
      GF_SERVER_HTTP_PORT: "3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
      - grafana-data:/var/lib/grafana

volumes:
  prom-data:
  grafana-data:
