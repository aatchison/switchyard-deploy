# Switchyard v0.2.0 - Anthropic-only, four selectable routes.
# NO SECRET IN THIS FILE: api_key_env names an env var, read at startup.
schema_version = 1

[llm_clients.anthropic]
format = "anthropic_messages"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
# x-api-key + anthropic-version are added by the Anthropic backend automatically.

# --- targets: exactly three, each a unique model id on this client. -----------
# All four routes SHARE these targets. Sharing (rather than declaring a second
# target per route) is what avoids the v0.2.0 "reuses model id ... only one
# target per id is kept and the other is dropped" WARN.
# Haiku 4.5 rejects BOTH `thinking:{adaptive}` and `output_config.effort`, which
# Switchyard emits together whenever an inbound request carries reasoning effort.
# Anthropic's OpenAI-compatible endpoint accepts the OpenAI-style
# `reasoning_effort` param instead, so the small/fast route talks to Anthropic
# over openai_chat. Same key, same provider - only the wire format differs.
[llm_clients.anthropic_oai]
format = "openai_chat"
base_url = "https://api.anthropic.com/v1"
api_key_env = "ANTHROPIC_API_KEY"

[targets.judge]
id = "claude-haiku-4-5-20251001"
llm_client = "anthropic"

[targets.sonnet]
id = "claude-sonnet-5"
llm_client = "anthropic"

[targets.opus]
id = "claude-opus-5"
llm_client = "anthropic"

[targets.fable]
id = "claude-fable-5-1"
llm_client = "anthropic"

# --- 1. top: Opus 5 direct ---------------------------------------------------
[routes.top]
id = "top"
type = "passthrough"
target = "opus"

# --- haiku: Haiku 4.5 direct. Claude Code's ANTHROPIC_SMALL_FAST_MODEL uses
# this for background/title-gen calls. Deliberately reuses the EXISTING
# `judge` target rather than declaring a second target with the same model id,
# which would trip the v0.2.0 "reuses model id ... one target is dropped" WARN.
[routes.haiku]
id = "haiku"
type = "passthrough"
target = "judge"

# --- 2. smart: Sonnet 5 direct ----------------------------------------------
# smart: stage_router - Sonnet by default, escalates to Opus on tool-loop
# failure / error / no-progress signals. Signal-driven, so ~0ms overhead and
# no judge call (unlike `judged`).
[routes.smart]
id = "smart"
type = "stage_router"
efficient_target = "sonnet"
capable_target = "opus"
picker = "efficient_first"
confidence_threshold = 0.5
recent_turn_window = 3

[routes.smart.handoff_notes]
escalation_note = "[router-guidance] A weaker model was handling this task and showed signs of stalling, looping, or repeated errors on the preceding steps, so control was escalated to you, a stronger model. Re-examine the current state directly and do not simply repeat the previous approach."
only_on_wrong_signal_escalation = true

# --- front_door: entry point for the manual 3-tier ladder sonnet -> opus ->
# fable. Switchyard's stage_router only supports 2 tiers per route (a target
# resolves straight to a model id, never to another route), so there is no
# single-route 3-tier escalation. front_door IS the sonnet<->opus hop
# (identical behavior to `smart`); when opus keeps struggling, manually
# switch mid-session to `capable_escalate` for the opus<->fable hop. See
# README.md "Front door / capable escalate" for the full explanation.
[routes.front_door]
id = "front_door"
type = "stage_router"
efficient_target = "sonnet"
capable_target = "opus"
picker = "efficient_first"
confidence_threshold = 0.5
recent_turn_window = 3

[routes.front_door.handoff_notes]
escalation_note = "[router-guidance] A weaker model was handling this task and showed signs of stalling, looping, or repeated errors on the preceding steps, so control was escalated to you, a stronger model. Re-examine the current state directly and do not simply repeat the previous approach. If problems persist even at this tier, the operator can manually switch to the capable_escalate route for a further escalation to Fable 5.1."
only_on_wrong_signal_escalation = true

# --- capable_escalate: second hop of the manual ladder. Efficient tier is
# Opus 5 (not Sonnet) so a session already escalated to Opus on front_door
# continues to default there; capable tier is Fable 5.1, Anthropic's
# top-of-line model, for when Opus itself is struggling.
[routes.capable_escalate]
id = "capable_escalate"
type = "stage_router"
efficient_target = "opus"
capable_target = "fable"
picker = "efficient_first"
confidence_threshold = 0.5
recent_turn_window = 3

[routes.capable_escalate.handoff_notes]
escalation_note = "[router-guidance] Opus was handling this task and showed signs of stalling, looping, or repeated errors on the preceding steps, so control was escalated to you, Fable 5.1, Anthropic's most capable model. Re-examine the current state directly and do not simply repeat the previous approach."
only_on_wrong_signal_escalation = true

# --- smart_sonnet_fable: same stage_router behavior as `smart`, but the
# escalation target is Fable 5.1 instead of Opus 5. Sonnet 5 still handles
# everything by default; only the "stronger model" tier is swapped.
[routes.smart_sonnet_fable]
id = "smart_sonnet_fable"
type = "stage_router"
efficient_target = "sonnet"
capable_target = "fable"
picker = "efficient_first"
confidence_threshold = 0.5
recent_turn_window = 3

[routes.smart_sonnet_fable.handoff_notes]
escalation_note = "[router-guidance] A weaker model was handling this task and showed signs of stalling, looping, or repeated errors on the preceding steps, so control was escalated to you, a stronger model. Re-examine the current state directly and do not simply repeat the previous approach."
only_on_wrong_signal_escalation = true

# --- fable5: Fable 5.1 direct, in the same slot `top` occupies for Opus 5.
# Named `fable5`, NOT `fable` -- Claude Code has a built-in model alias
# literally named "fable" that it resolves client-side to claude-fable-5-1
# before validating the response, which fails a stricter check than the
# unknown-model bypass covers ("There's an issue with the selected model
# (claude-fable-5-1)..."). Every other route name here (smart, front_door,
# capable_escalate, etc.) is NOT a Claude Code alias, so they pass through
# unchecked; `fable` was the one collision. Verified: real Anthropic
# `--model fable` resolves fine on its own, but round-tripped through
# Switchyard under that same name it fails; renamed to fable5, it works.
[routes.fable5]
id = "fable5"
type = "passthrough"
target = "fable"

# --- 3. judged: Haiku judges up front, then Sonnet or Opus serves -----------
[routes.judged]
id = "judged"
type = "llm_classifier"
mode = "capability"
classifier_target = "judge"
weak_target = "sonnet"
strong_target = "opus"
base_threshold = 0.45
threshold_step = 0.15
classify_trigger = "new_session"
message_hash_fallback = true

# --- 4. balanced: 50/50 A/B split across Sonnet and Opus, no judge call -----
[routes.balanced]
id = "balanced"
type = "random"
targets = ["sonnet", "opus"]
weights = [1, 1]

# --- model-id alias routes -------------------------------------------------
# Consumers (model pickers, resumed sessions with a pinned model) request real
# Anthropic model ids. Without these they 404 with "No route registered for
# model X". claude-sonnet-5 / claude-opus-5 reuse the EXISTING targets, so no
# duplicate model id on one client; 4-6 / 4-7 are new ids needing new targets.
[targets.sonnet46]
id = "claude-sonnet-4-6"
llm_client = "anthropic"

[targets.opus47]
id = "claude-opus-4-7"
llm_client = "anthropic"

[routes.alias_sonnet5]
id = "claude-sonnet-5"
type = "passthrough"
target = "sonnet"

[routes.alias_opus5]
id = "claude-opus-5"
type = "passthrough"
target = "opus"

[routes.alias_sonnet46]
id = "claude-sonnet-4-6"
type = "passthrough"
target = "sonnet46"

[routes.alias_opus47]
id = "claude-opus-4-7"
type = "passthrough"
target = "opus47"
